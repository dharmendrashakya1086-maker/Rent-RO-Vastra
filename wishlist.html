  <section style="padding-top: 130px; padding-bottom: 60px;">

</div>

  <script src="app.js"></script>
  <script src="store.js"></script>
<script>
    storeReady(function () {
    function renderWishlist() {
      const w = getWishlist();
      const el = document.getElementById('wishlistContent');
      updateWishCount();

      if (w.length === 0) {
        el.innerHTML = '<div class="cart-empty"><svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:var(--gold);"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><h2>Your wishlist is empty</h2><p>Tap the heart on any piece to save it here</p><a href="/collection" class="btn-primary">Browse Collection</a></div>';
        return;
      }

      const itemsHtml = w.map((item, i) => {
        return '<div class="cart-item"><a href="/piece/' + item.id + '" class="cart-item-img" style="display:block;"><img src="' + item.img + '" alt="' + (item.name || 'Rented piece') + '" style="width:100%;height:100%;object-fit:cover;"></a><div class="cart-item-info"><div class="cart-item-cat">' + item.category + '</div><a href="/piece/' + item.id + '" style="color:inherit;text-decoration:none;"><div class="cart-item-name">' + item.name + '</div></a><div class="cart-item-price"><strong>₹' + item.price + '</strong> / day</div><div style="display:flex;gap:10px;margin-top:12px;"><button class="card-btn filled" data-idx="' + i + '" data-action="cart">Add to Cart</button><button class="card-btn wish-btn" data-idx="' + i + '" data-action="remove" title="Remove">&#9829;</button></div></div></div>';
      }).join('');

      el.innerHTML = itemsHtml;

      document.querySelectorAll('[data-action="cart"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          const item = getWishlist()[idx];
          if (addToCart({ id: item.id, name: item.name, category: item.category, price: item.price, img: item.img })) {
            btn.textContent = 'Added!';
            btn.style.background = '#4CAF50';
            flyToCart(item, btn);
          } else {
            window.location.href = '/cart?item=' + item.id;
          }
        });
      });
      document.querySelectorAll('[data-action="remove"]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeWishlist(parseInt(btn.dataset.idx));
          showToast('Removed from wishlist');
          renderWishlist();
        });
      });
    }
renderWishlist();
  });
  </script>
