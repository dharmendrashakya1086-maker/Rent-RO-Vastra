<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Rent-RO-Vastra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>

    <header class="main-header">
    <a href="index.html" class="header-logo">Rent-RO-Vastra</a>
    <div class="header-search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="headerSearch" placeholder="Search designer pieces...">
    </div>
    <div class="header-icons">
      <a href="wishlist.html" class="header-icon" title="Wishlist">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="h-badge" id="wishBadge" style="display:none">0</span>
      </a>
      <a href="cart.html" class="header-icon" title="Cart">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span class="h-badge" id="cartCount">0</span>
      </a>
      <a href="messages.html" class="header-icon header-msg" title="Messages"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg><span class="h-badge" id="msgBadge" style="display:none">0</span></a>
      <a href="auth.html" class="header-icon header-account" title="Account">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </a>
    </div>
  </header><nav>
    <div class="nav-inner">
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="catalog.html">Collection</a>
        <a href="ugc.html">Client Looks</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section style="padding-top: 120px; padding-bottom: 60px;">
    <div class="container">
      <h1 class="section-title" style="text-align:left;">Your Cart</h1>
      <div id="cartContent"></div>
</div>
  </section>

  <script src="app.js"></script>
  <script src="store.js"></script>
<script>
    storeReady(function () {
    function renderCart() {
      const cart = getCart();
      const el = document.getElementById('cartContent');
      document.getElementById('cartCount').textContent = cart.length;

      if (cart.length === 0) {
        el.innerHTML = '<div class="cart-empty"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><h2>Your cart is empty</h2><p>Browse our collection and add pieces to your cart</p><a href="catalog.html" class="btn-primary">Browse Collection</a></div>';
        return;
      }

let subtotal = 0;
      let conflictItems = 0;
      const itemsHtml = cart.map((item, i) => {
        const days = item.days || 1;
        const qty = item.qty || 1;
        const total = rentalTotal(item.price, days, qty);
        subtotal += total;
        let availNote = '';
        if (item.id && item.startDate && item.endDate) {
          const a = stockAvailability(item.id, item.startDate, item.endDate);
          if (!a.enough || a.available < qty) { conflictItems++; availNote = '<div style="color:#ff8a80;font-size:0.75rem;margin-top:6px;">✗ Only ' + a.available + ' available for these dates</div>'; }
        }
        const note = days >= 3 ? '<div style="color:#4CAF50;font-size:0.75rem;margin-top:2px;">' + days + ' days — ' + (days >= 7 ? '25' : '15') + '% off applied</div>' : '';
        return '<div class="cart-item" data-id="' + (item.id || '') + '"><img src="' + item.img + '" alt="" class="cart-item-img"><div class="cart-item-info"><div class="cart-item-cat">' + item.category + '</div><div class="cart-item-name">' + item.name + '</div><div class="cart-item-price"><strong>₹' + item.price + '</strong> / day' + note + '</div><div class="cart-item-dates"><input type="date" value="' + (item.startDate || '') + '" data-idx="' + i + '" data-field="startDate" class="cart-date" aria-label="' + item.name + ' rental start date"><input type="date" value="' + (item.endDate || '') + '" data-idx="' + i + '" data-field="endDate" class="cart-date" aria-label="' + item.name + ' rental end date"></div><div class="cart-qty"><span>Qty</span><button class="qty-btn" data-idx="' + i + '" data-delta="-1" aria-label="Decrease quantity of ' + item.name + '">−</button><span class="qty-val">' + qty + '</span><button class="qty-btn" data-idx="' + i + '" data-delta="1" aria-label="Increase quantity of ' + item.name + '">+</button></div>' + availNote + '<div style="display:flex;gap:10px;"><a class="card-btn filled" style="text-decoration:none;flex:0 0 auto;padding:10px 18px;" href="checkout.html?item=' + (item.id || '') + '">Rent This</a><button class="cart-item-remove" data-idx="' + i + '" aria-label="Remove ' + item.name + ' from cart"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span>Remove</span></button></div></div></div>';
      }).join('');

      const discountAmt = subtotal > 500 ? 0 : 0;
      const finalTotal = subtotal - discountAmt;

      el.innerHTML = '<div class="cart-grid"><div>' + itemsHtml + '</div><div class="cart-summary"><h3>Order Summary</h3><div class="cart-summary-row"><span>Subtotal (' + cart.length + ' items)</span><span>₹' + subtotal.toFixed(2) + '</span></div><div class="cart-summary-row"><span>Delivery</span><span style="color:#4CAF50">Free</span></div><div class="cart-summary-row total"><span>Total</span><span>₹' + finalTotal.toFixed(2) + '</span></div><a href="checkout.html" class="btn-primary" style="display:block;text-align:center;margin-top:24px;">Proceed to Checkout</a><a href="catalog.html" style="display:block;text-align:center;margin-top:12px;color:var(--gold);font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;">Continue Shopping</a></div></div>';

document.querySelectorAll('.cart-item-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(parseInt(btn.dataset.idx));
          showToast('Removed from cart');
          renderCart();
        });
      });

      document.querySelectorAll('.cart-warning').forEach(() => {});
      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          const delta = parseInt(btn.dataset.delta);
          const cart = getCart();
          const item = cart[idx];
          if (!item) return;
          const cur = item.qty || 1;
          const next = cur + delta;
          if (next < 1) {
            removeFromCart(idx);
            showToast('Removed from cart');
            renderCart();
            return;
          }
          if (item.id && item.startDate && item.endDate) {
            const a = stockAvailability(item.id, item.startDate, item.endDate);
            if (next > a.available) {
              showToast('Only ' + a.available + ' available for these dates');
              return;
            }
          }
          setCartQty(idx, next);
          renderCart();
        });
      });
      document.querySelectorAll('.cart-date').forEach(input => {
        input.addEventListener('change', () => {
          const idx = parseInt(input.dataset.idx);
          const field = input.dataset.field;
          let cart = getCart();
          if (cart[idx]) {
            cart[idx][field] = input.value;
            if (cart[idx].startDate && cart[idx].endDate) {
              const days = Math.ceil((new Date(cart[idx].endDate) - new Date(cart[idx].startDate)) / 86400000) + 1;
              cart[idx].days = days > 0 ? days : 1;
            }
            saveCart(cart);
            renderCart();
          }
        });
      });
}
    renderCart();

    // If landed from "already in cart" → highlight that item
    const targetId = new URLSearchParams(location.search).get('item');
    if (targetId) {
      setTimeout(() => {
        const row = document.querySelector('.cart-item[data-id="' + targetId + '"]');
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          row.classList.add('cart-highlight');
          setTimeout(() => row.classList.remove('cart-highlight'), 2200);
        }
      }, 150);
    }
  });
  </script>
</body>
</html>
