<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Rent-RO-Vastra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>

    <header class="main-header">
    <a href="index.html" class="header-logo">Rent-RO-Vastra</a>
    <div class="header-search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="headerSearch" placeholder="Search designer pieces...">
    </div>
    <div class="header-icons">
      <a href="wishlist.html" class="header-icon" title="Wishlist">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="h-badge" id="wishBadge" style="display:none">0</span>
      </a>
      <a href="cart.html" class="header-icon" title="Cart">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span class="h-badge" id="cartCount">0</span>
      </a>
      <a href="messages.html" class="header-icon header-msg" title="Messages">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        <span class="h-badge" id="msgBadge" style="display:none">0</span>
      </a>
      <a href="auth.html" class="header-icon header-account" title="Account">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </a>
    </div>
  </header><nav>
    <div class="nav-inner">
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="catalog.html">Collection</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <button class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section style="padding-top: 140px; padding-bottom: 60px;">
    <div class="container">
      <div id="authGate"></div>
      <div id="msgArea" style="display:none;">
        <h2 style="font-family:var(--serif);color:var(--white);margin-bottom:24px;">Messages</h2>
        <div class="msg-layout">
          <aside class="msg-side">
            <h3 style="color:var(--gold);font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;">Conversations</h3>
            <button class="msg-new" id="newThreadBtn">+ New Message</button>
            <div id="threadList"></div>
          </aside>
          <div class="msg-main">
            <div id="composeBox" style="display:none;margin-bottom:24px;" class="msg-compose">
              <div class="form-group"><label for="msgTo">Recipient</label><select id="msgTo" aria-label="Recipient" style="width:100%;padding:12px 16px;background:var(--dark2);border:1px solid rgba(201,169,110,0.2);color:var(--text);font-family:var(--sans);font-size:0.88rem;"></select></div>
              <div class="form-group"><label for="msgText">Message</label><textarea id="msgText" rows="3" maxlength="2000" aria-label="Message" style="width:100%;padding:12px 16px;background:var(--dark2);border:1px solid rgba(201,169,110,0.2);color:var(--text);font-family:var(--sans);font-size:0.88rem;resize:vertical;" placeholder="Type your message..."></textarea></div>
              <label style="display:flex;align-items:flex-start;gap:8px;font-size:0.72rem;color:var(--text-muted);margin-bottom:14px;cursor:pointer;line-height:1.5;"><input type="checkbox" id="msgConsent" style="accent-color:var(--gold);margin-top:3px;"> I consent to these messages being stored so Rent-RO-Vastra can serve this enquiry.</label>
              <button class="btn-primary" id="msgSendBtn2" style="text-align:center;">Send</button>
            </div>
            <div id="threadView"><div style="color:var(--text-muted);text-align:center;padding:60px 0;">Select a conversation to view messages</div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
  <script src="store.js"></script>
  <script>
    storeReady(function () {
    const me = currentUser();
    if (!me) {
      document.getElementById('authGate').innerHTML = '<div style="text-align:center;padding:60px 0;"><h2 style="font-family:var(--serif);color:var(--white);margin-bottom:16px;">Please login</h2><p style="color:var(--text-muted);margin-bottom:24px;">You need to be logged in to send and receive messages</p><a href="auth.html" class="btn-primary">Login / Register</a></div>';
    } else {
      document.getElementById('msgArea').style.display = 'block';
      const activeThread = { partner: null };
      populateRecipients();
      renderThreadList();
      document.getElementById('newThreadBtn').addEventListener('click', () => {
        document.getElementById('composeBox').style.display = 'block';
      });
      document.getElementById('msgSendBtn2').addEventListener('click', () => {
        const to = document.getElementById('msgTo').value;
        const body = document.getElementById('msgText').value.trim();
        if (!to || !body) return;
        if (!document.getElementById('msgConsent').checked) { alert('Please tick the consent box before sending.'); return; }
        sendMessage(me.email, to, body);
        document.getElementById('msgText').value = '';
        document.getElementById('composeBox').style.display = 'none';
        activeThread.partner = (to === 'admin') ? 'admin' : to;
        renderThreadList();
        renderThread();
        updateMsgCount();
      });
      document.getElementById('msgTo').addEventListener('change', function () {
        const to = this.value;
        document.getElementById('composeBox').style.display = 'block';
        activeThread.partner = (to === 'admin') ? 'admin' : to;
        renderThreadList();
        renderThread();
        markRead(activeThread.partner);
      });
    }

    function populateRecipients() {
      const sel = document.getElementById('msgTo');
      let html = '<option value="admin">Rent-RO-Vastra (Admin)</option>';
      getUsers().filter(u => u.email !== me.email).forEach(u => {
        html += '<option value="' + u.email + '">' + u.first + ' ' + (u.last || '') + '</option>';
      });
      sel.innerHTML = html;
    }

    function threadMeta(m) {
      if (m.from === 'admin' || (m.to === 'admin' && m.from !== me.email)) return 'admin';
      if (m.from === me.email) return m.to;
      return m.from;
    }

    function renderThreadList() {
      const partners = conversationPartners(me.email).filter(p => p !== me.email);
      const el = document.getElementById('threadList');
      if (partners.length === 0) { el.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">No conversations yet</p>'; return; }
      const unreadFor = p => getMessages().filter(m => !m.readBy.includes(me.email) && ((m.to === me.email && threadMeta(m) === p) || (m.to === 'ALL' && m.from === 'admin' && p === 'admin')) && m.from !== me.email).length;
      el.innerHTML = partners.map(p => {
        const unread = unreadFor(p);
        const label = p === 'admin' ? 'Rent-RO-Vastra (Admin)' : p;
        const last = getMessages().filter(m => threadMeta(m) === p && m.from !== me.email).sort((a, b) => b.time - a.time)[0];
        return '<div class="msg-thread' + (activeThread.partner === p ? ' active' : '') + '" data-partner="' + p + '"><div><div class="msg-thread-name">' + label + (unread ? ' <span class="msg-unread">' + unread + '</span>' : '') + '</div><div class="msg-thread-prev">' + (last ? last.body : '') + '</div></div></div>';
      }).join('');
      el.querySelectorAll('.msg-thread').forEach(div => {
        div.addEventListener('click', () => {
          activeThread.partner = div.dataset.partner;
          renderThreadList();
          renderThread();
          markRead(activeThread.partner);
        });
      });
    }

    function renderThread() {
      const el = document.getElementById('threadView');
      const p = activeThread.partner;
      if (!p) return;
      const msgs = getMessages().filter(m => threadMeta(m) === p).sort((a, b) => a.time - b.time);
      const label = p === 'admin' ? 'Rent-RO-Vastra (Admin)' : p;
      el.innerHTML = '<div class="msg-hdr">' + label + '</div>' + (msgs.length === 0
        ? '<p style="color:var(--text-muted);text-align:center;padding:40px;">Send a message to start the conversation</p>'
        : msgs.map(m => {
          const mine = m.from === me.email;
          const time = new Date(m.time).toLocaleString();
          return '<div class="msg-bubble ' + (mine ? 'mine' : 'theirs') + '"><div class="msg-body">' + m.body.replace(/</g, '&lt;') + '</div><div class="msg-time">' + time + '</div></div>';
        }).join(''));
    }

    function markRead(p) {
      getMessages().forEach(m => {
        if (!m.readBy.includes(me.email) && m.from !== me.email &&
            ((m.to === me.email && threadMeta(m) === p) || (m.to === 'ALL' && p === 'admin' && m.from === 'admin'))) {
          markMessageRead(m.id, me.email);
        }
      });
      renderThreadList();
      updateMsgCount();
    }
  });
  </script>
  <script src="chat.js"></script>
</body>
</html>
