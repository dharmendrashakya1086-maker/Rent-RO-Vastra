<div class="auth-page">
    <div class="auth-box">
<div class="wrap-logo" style="text-align:center;">
        <a href="/" class="logo" style="font-size:1.3rem;">Rent-RO-Vastra</a>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>
      <h1 class="auth-title">Login or create your account</h1>

      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label for="loginId">Username / Phone / Email</label>
          <input type="text" id="loginId" placeholder="yourname / +91 99999 99999 / you@example.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" placeholder="Your password" required autocomplete="current-password">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <label style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:0.75rem;cursor:pointer;">
            <input type="checkbox" id="rememberMe" style="accent-color:var(--gold);"> Remember me
          </label>
          <button type="button" id="forgotLink" style="color:var(--gold);font-size:0.75rem;text-decoration:underline;background:none;border:none;cursor:pointer;">Forgot password?</button>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;text-align:center;">Login</button>
        <div class="auth-divider">or login with code</div>
        <div id="otpBox">
          <div class="form-group">
            <label for="otpEmail">Email</label>
            <input type="email" id="otpEmail" placeholder="you@example.com">
          </div>
          <button type="button" class="btn-outline" id="otpSend" style="width:100%;text-align:center;">Send login code</button>
          <div class="form-group" id="otpCodeWrap" style="display:none;">
            <label for="otpCode">6-digit code</label>
            <input type="text" id="otpCode" inputmode="numeric" maxlength="6" placeholder="000000">
          </div>
          <button type="button" class="btn-primary" id="otpVerify" style="width:100%;text-align:center;display:none;">Verify &amp; Login</button>
          <p id="otpMsg" style="margin-top:10px;font-size:0.72rem;color:var(--text-muted);text-align:center;min-height:1em;"></p>
        </div>
      </form>

<form class="auth-form" id="forgotForm" style="display:none;">
        <h2 class="auth-subtitle">Reset password</h2>
        <div class="form-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="button" class="btn-outline" id="forgotSend" style="width:100%;text-align:center;">Send code</button>
        <p id="forgotHint" style="margin-top:8px;font-size:0.72rem;color:var(--text-muted);text-align:center;min-height:1em;">Check your Gmail for the OTP</p>
        <div class="form-group">
          <label for="forgotCode">6-digit code</label>
          <input type="text" id="forgotCode" inputmode="numeric" maxlength="6" placeholder="000000" required>
        </div>
        <div class="form-group">
          <label for="forgotPass">New password</label>
          <input type="password" id="forgotPass" placeholder="Min 8 characters" minlength="8" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;text-align:center;">Reset password</button>
        <button type="button" class="btn-text" id="forgotBack" style="width:100%;text-align:center;border:none;background:none;color:var(--text-muted);font-size:0.75rem;text-decoration:underline;cursor:pointer;margin-top:10px;">Back to login</button>
      </form>

<form class="auth-form" id="registerForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="form-group">
            <label for="regFirst">First Name</label>
            <input type="text" id="regFirst" placeholder="Jane" required>
          </div>
          <div class="form-group">
            <label for="regLast">Last Name</label>
            <input type="text" id="regLast" placeholder="Doe" required>
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="regCode">Email code <span style="color:var(--text-muted);font-weight:400;">(required)</span></label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="regCode" inputmode="numeric" maxlength="6" placeholder="000000" required style="flex:1;min-width:0;">
            <button type="button" class="btn-outline" id="regOtpSend" style="padding:0 14px;white-space:nowrap;">Send code</button>
          </div>
          <p id="regOtpHint" style="margin-top:6px;font-size:0.72rem;color:var(--text-muted);min-height:1em;">Check your Gmail for the OTP</p>
        </div>
        <div class="form-group">
          <label for="regPhone">Phone</label>
          <input type="tel" id="regPhone" placeholder="+91 00000 00000">
        </div>
        <div class="form-group">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" placeholder="Min 8 characters" required minlength="8">
        </div>
<div class="form-group">
          <label for="regPassConfirm">Confirm Password</label>
          <input type="password" id="regPassConfirm" placeholder="Confirm password" required aria-label="Confirm password">
        </div>
        <label style="display:flex;align-items:flex-start;gap:8px;color:var(--text-muted);font-size:0.72rem;margin-bottom:16px;cursor:pointer;line-height:1.5;">
          <input type="checkbox" id="regConsent" style="accent-color:var(--gold);margin-top:3px;" required>
          I agree to the <a href="/terms" style="color:var(--gold);text-decoration:underline;" target="_blank" rel="noopener">Terms &amp; Conditions</a> and <a href="/privacy" style="color:var(--gold);text-decoration:underline;" target="_blank" rel="noopener">Privacy Policy</a>, and I consent to my details being used to manage my rentals.
        </label>
<button type="submit" class="btn-primary" style="width:100%;text-align:center;">Create Account</button>
      </form>
      <div class="lock-error" id="authError" style="margin-top:16px;text-align:center;"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="store.js"></script>
  <script>
    const lockSendBtn = (btn, secs = 60) => {
      const orig = btn.dataset.label || btn.textContent;
      btn.dataset.label = orig;
      btn.disabled = true;
      btn.classList.add('disabled');
      let n = secs;
      btn.textContent = 'Resend in ' + n + 's';
      const tick = setInterval(() => {
        n -= 1;
        if (n <= 0) { clearInterval(tick); btn.disabled = false; btn.classList.remove('disabled'); btn.textContent = orig; }
        else btn.textContent = 'Resend in ' + n + 's';
      }, 1000);
    };

    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('loginForm').style.display = '';
        document.getElementById('authError').textContent = '';
      });
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value;
      const err = document.getElementById('authError');
      if (!id) { err.style.color = '#ff8a80'; err.textContent = 'Enter your username, phone or email'; return; }
      login(id, pass).then(user => {
        if (user) {
          err.style.color = '#4CAF50';
          err.textContent = 'Login successful! Redirecting...';
          setTimeout(() => { window.location.href = '/account'; }, 800);
        } else {
          err.style.color = '#ff8a80';
          err.textContent = 'Invalid login details';
        }
      }).catch(e => {
        err.style.color = '#ff8a80';
        err.textContent = e.message || 'Login failed. Please try again.';
      });
    });

    // Forgot password view
    const showView = (showLogin) => {
      document.getElementById('loginForm').style.display = showLogin ? '' : 'none';
      document.getElementById('forgotForm').style.display = showLogin ? 'none' : '';
      document.getElementById('authError').textContent = '';
    };
    document.getElementById('forgotLink').addEventListener('click', () => showView(false));
    document.getElementById('forgotBack').addEventListener('click', () => showView(true));
    document.getElementById('forgotSend').addEventListener('click', async () => {
      const hint = document.getElementById('forgotHint');
      const em = document.getElementById('forgotEmail').value.trim();
      if (!em) { hint.style.color = '#ff8a80'; hint.textContent = 'Enter your email first.'; return; }
      hint.style.color = 'var(--text-muted)';
      hint.textContent = 'Sending code...';
      try {
        await forgot(em);
        hint.style.color = '#4CAF50';
        hint.textContent = 'Check your Gmail for the OTP';
        lockSendBtn(document.getElementById('forgotSend'));
      } catch (e) { hint.style.color = '#ff8a80'; hint.textContent = e.message || 'Could not send code'; }
    });
    document.getElementById('forgotForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('authError');
      const em = document.getElementById('forgotEmail').value.trim();
      const code = document.getElementById('forgotCode').value.trim();
      const pass = document.getElementById('forgotPass').value;
      if (!code) { err.style.color = '#ff8a80'; err.textContent = 'Enter the 6-digit code from your email'; return; }
      if (pass.length < 8) { err.style.color = '#ff8a80'; err.textContent = 'Password must be at least 8 characters'; return; }
      try {
        await resetPass(em, code, pass);
        err.style.color = '#4CAF50';
        err.textContent = 'Password reset! Logging you in...';
        setTimeout(() => { window.location.href = '/account'; }, 800);
      } catch (e) { err.style.color = '#ff8a80'; err.textContent = e.message || 'Could not reset password. Try again.'; }
    });

    // Register
    document.getElementById('regOtpSend').addEventListener('click', async () => {
      const hint = document.getElementById('regOtpHint');
      const em = document.getElementById('regEmail').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { hint.style.color = '#ff8a80'; hint.textContent = 'Enter a valid email first.'; return; }
      hint.style.color = 'var(--text-muted)';
      hint.textContent = 'Sending code...';
      try {
        await sendOtp(em);
        hint.style.color = '#4CAF50';
        hint.textContent = 'Check your Gmail for the OTP';
        lockSendBtn(document.getElementById('regOtpSend'));
      } catch (e) { hint.style.color = '#ff8a80'; hint.textContent = e.message || 'Could not send code'; }
    });
    document.getElementById('registerForm').addEventListener('submit', e => {
      e.preventDefault();
      const err = document.getElementById('authError');
      const first = document.getElementById('regFirst').value.trim();
      const last = document.getElementById('regLast').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const code = document.getElementById('regCode').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPass').value;
      const confirm = document.getElementById('regPassConfirm').value;

      if (pass !== confirm) { err.style.color = '#ff8a80'; err.textContent = 'Passwords do not match'; return; }
      if (pass.length < 8) { err.style.color = '#ff8a80'; err.textContent = 'Password must be at least 8 characters'; return; }
      if (!code) { err.style.color = '#ff8a80'; err.textContent = 'Enter the 6-digit code sent to your email'; return; }
      if (!document.getElementById('regConsent').checked) { err.style.color = '#ff8a80'; err.textContent = 'Please accept the Terms & Conditions and Privacy Policy.'; return; }

      register({ first, last, email, phone, pass, code }).then(user => {
        if (user) {
          err.style.color = '#4CAF50';
          err.textContent = 'Account created! Redirecting...';
          setTimeout(() => { window.location.href = '/account'; }, 800);
        } else {
          err.style.color = '#ff8a80';
          err.textContent = 'Email already registered';
        }
      }).catch(e => {
        err.style.color = '#ff8a80';
        err.textContent = e.message || 'Could not create account. Please try again.';
      });
    });

    // Email OTP login (Supabase)
    const otpMsg = document.getElementById('otpMsg');
    document.getElementById('otpSend').addEventListener('click', async () => {
      const em = document.getElementById('otpEmail').value.trim();
      if (!em) { otpMsg.textContent = 'Enter your email first.'; return; }
      otpMsg.textContent = 'Sending code...';
      try {
        const r = await fetch('/api/auth/otp/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Could not send code');
        otpMsg.style.color = '#4CAF50';
        otpMsg.textContent = 'Code sent to ' + em + '. Check your inbox.';
        document.getElementById('otpCodeWrap').style.display = '';
        document.getElementById('otpVerify').style.display = '';
        document.getElementById('otpSend').textContent = 'Resend code';
        lockSendBtn(document.getElementById('otpSend'));
      } catch (e) { otpMsg.style.color = '#ff8a80'; otpMsg.textContent = e.message; }
    });
    document.getElementById('otpVerify').addEventListener('click', async () => {
      const em = document.getElementById('otpEmail').value.trim();
      const code = document.getElementById('otpCode').value.trim();
      if (!code) { otpMsg.textContent = 'Enter the 6-digit code.'; return; }
      otpMsg.textContent = 'Verifying...';
      try {
        const r = await fetch('/api/auth/otp/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em, code }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Could not verify code');
        otpMsg.style.color = '#4CAF50';
        otpMsg.textContent = 'Logged in! Redirecting...';
        setTimeout(() => { window.location.href = '/account'; }, 800);
      } catch (e) { otpMsg.style.color = '#ff8a80'; otpMsg.textContent = e.message; }
    });
  </script>
<script src="modern.js"></script>
</body>
